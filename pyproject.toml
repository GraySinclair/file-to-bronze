[project]
name = "file-to-bronze"
dynamic = ["version"]
description = "Micro-package to facilitate files-to-bronze table loading in a structured manner."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gray Sinclair" }
]
dependencies = []

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/file_to_bronze",
    "tests",
]
